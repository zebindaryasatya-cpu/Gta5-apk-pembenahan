# Release origins for the game app and the preload APK: one release index URL per line.
# Packaged as assets/origins.conf (scripts/android-linux.sh, scripts/package-preload.sh).
#
# The app tries every origin at once when it checks or downloads: an origin must serve a
# schema 1 release.json, then the first megabyte of its largest game file is timed, and the
# fastest wins (held for ten minutes). An origin's files are fetched from its own host, so
# each line needs a complete copy of the release next to its index.
# The APK's preload-url is always a candidate too, and the fallback if nothing answers.
#
# https only. '#' starts a comment.

https://larpconnect.thevakhovske.eu.org/release.json
https://gw-download.dodster.lol/release.json
https://ru-delivery.thevakhovske.eu.org/release.json
https://de-fr-download.thevakhovske.eu.org/release.json
